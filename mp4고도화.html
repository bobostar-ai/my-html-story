<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스펙트럼 스튜디오 Pro - 고화질 렌더링 에디션</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }

        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }

        .header { 
            height: 60px; 
            background: linear-gradient(135deg, #222 0%, #000 100%); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 30px; 
            border-bottom: 1px solid #333;
            z-index: 100;
        }
        .header h1 { font-size: 1.4em; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }

        .main-content { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 380px; background-color: var(--panel-bg); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .tab-menu { display: flex; background: #111; border-bottom: 1px solid #333; overflow-x: auto; }
        .tab-btn { flex: none; width: 25%; padding: 15px 5px; border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 0.8em; font-weight: 600; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); background: var(--panel-bg); }
        .tab-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        .tab-content.active { display: block; }

        .preview-container { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; padding: 20px; align-items: center; justify-content: center; }
        .canvas-frame { 
            width: 100%; 
            max-width: 1200px; 
            aspect-ratio: 16/9; 
            background: #000; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
            border-radius: 4px; 
            overflow: hidden; 
            position: relative;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; }

        .player-bar { 
            width: 90%; 
            max-width: 900px; 
            background: rgba(30,30,30,0.9); 
            backdrop-filter: blur(15px); 
            border-radius: 50px; 
            padding: 12px 25px; 
            margin-top: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .play-toggle { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--primary); color: white; cursor: pointer; font-size: 1em; display: flex; align-items: center; justify-content: center; }

        .prop-group { margin-bottom: 15px; border-bottom: 1px solid #2a2a2a; padding-bottom: 15px; }
        .prop-label { font-size: 0.8em; color: var(--text-dim); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .prop-label span.val { color: var(--primary); font-family: monospace; }
        
        .btn-action { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; background: var(--input-bg); color: #fff; transition: 0.2s; margin-bottom: 5px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
        
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        select, input[type="text"], textarea { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.85em; outline: none; }
        select:focus, input[type="text"]:focus { border-color: var(--primary); }
        .color-row { display: flex; gap: 10px; align-items: center; }
        input[type="color"] { background: none; border: none; width: 35px; height: 35px; cursor: pointer; }

        .gradient-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
        .grad-preset { width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .grad-preset:hover { transform: scale(1.1); }
        .grad-preset.active { border-color: #fff; box-shadow: 0 0 10px var(--primary); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal { background: #1e1e1e; padding: 30px; border-radius: 16px; width: 450px; border: 1px solid #333; text-align: left; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal h2 { font-size: 1.3em; margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .progress-track { height: 10px; background: #111; border-radius: 5px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(to right, var(--primary), var(--secondary)); transition: width 0.1s; }

        .pl-btn-sm { padding: 4px 8px; background: #333; border: none; color: #fff; border-radius: 3px; font-size: 0.8em; cursor: pointer; margin-left: 3px; transition: 0.2s; }
        .pl-btn-sm:hover { background: var(--primary); }
        .pl-btn-del:hover { background: #ff4d4d; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="header">
            <h1>🎵 SPECTRUM STUDIO PRO</h1>
            <button class="btn-primary" id="openExportBtn" style="padding: 8px 25px; border-radius: 4px; font-weight: bold; border:none; color:white; cursor:pointer;">🎬 MP4 내보내기</button>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="tab-menu">
                    <button class="tab-btn active" data-tab="visual">시각화</button>
                    <button class="tab-btn" data-tab="bg-effect">배경/효과</button>
                    <button class="tab-btn" data-tab="text-logo">텍스트/로고</button>
                    <button class="tab-btn" data-tab="playlist">목록/기능</button>
                </div>

                <div id="visual" class="tab-content active">
                    <div class="prop-group">
                        <label class="prop-label">스타일</label>
                        <select id="styleSelect">
                            <optgroup label="기본 스타일">
                                <option value="bars">막대형 (Bars)</option>
                                <option value="circular">원형 (Circular)</option>
                                <option value="mirror">미러링 (Mirror)</option>
                                <option value="radial">방사형 (Radial)</option>
                                <option value="shockwave">충격파 (Shockwave)</option>
                                <option value="waveform">파형 (Waveform)</option>
                            </optgroup>
                            <optgroup label="프리미엄 스타일">
                                <option value="symmetric-bars">대칭 막대 (Symmetric)</option>
                                <option value="visual-particles">파티클 (Visual Particles)</option>
                                <option value="liquid">리퀴드 웨이브 (Liquid)</option>
                                <option value="dust">앰비언트 더스트 (Dust)</option>
                                <option value="aurora">브리딩 오로라 (Aurora)</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="prop-group">
                        <label class="prop-label">스펙트럼 컬러 프리셋 (12종)</label>
                        <div class="gradient-grid" id="gradPresets"></div>
                    </div>

                    <div class="prop-group">
                        <label class="prop-label">커스텀 컬러 설정</label>
                        <div class="color-row">
                            <input type="color" id="color1" value="#667eea">
                            <input type="color" id="color2" value="#764ba2">
                            <span style="font-size:0.7em; color:#666">그라데이션</span>
                        </div>
                    </div>

                    <div class="prop-group">
                        <label class="prop-label">그라데이션 방향</label>
                        <select id="gradDir">
                            <option value="horizontal">가로 방향 (Horizontal)</option>
                            <option value="vertical">세로 방향 (Vertical)</option>
                        </select>
                    </div>

                    <div class="prop-group">
                        <label class="prop-label">막대 개수 <span class="val" id="val-barCount">128</span></label>
                        <input type="range" id="prop-barCount" min="32" max="256" step="8" value="128">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">시각화 투명도 <span class="val" id="val-specOpacity">100%</span></label>
                        <input type="range" id="prop-specOpacity" min="0" max="100" value="100">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">중심 X 위치 <span class="val" id="val-posX">960</span></label>
                        <input type="range" id="prop-posX" min="0" max="1920" value="960">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">중심 Y 위치 <span class="val" id="val-posY">540</span></label>
                        <input type="range" id="prop-posY" min="0" max="1080" value="540">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">크기 배율 <span class="val" id="val-scale">1.0</span></label>
                        <input type="range" id="prop-scale" min="0.1" max="3.0" step="0.1" value="1.0">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">민감도 <span class="val" id="val-sensitivity">5</span></label>
                        <input type="range" id="prop-sensitivity" min="1" max="10" value="5">
                    </div>
                </div>

                <div id="bg-effect" class="tab-content">
                    <button class="btn-action" onclick="document.getElementById('bgInput').click()">🖼️ 배경 이미지 선택</button>
                    <input type="file" id="bgInput" hidden accept="image/*">
                    
                    <div class="prop-group" style="margin-top:10px;">
                        <label class="prop-label">배경 투명도 <span class="val" id="val-bgOpacity">100%</span></label>
                        <input type="range" id="bgOpacity" min="0" max="100" value="100">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">밝기 <span class="val" id="val-brightness">100%</span></label>
                        <input type="range" id="bgBrightness" min="0" max="200" value="100">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">흐림(Blur) <span class="val" id="val-blur">0px</span></label>
                        <input type="range" id="bgBlur" min="0" max="30" value="0">
                    </div>
                    
                    <div class="prop-group">
                        <div class="toggle-row">
                            <span style="font-size:0.85em">비네팅 효과</span>
                            <input type="checkbox" id="vignetteToggle">
                        </div>
                        <div id="vignetteControls" style="display:none">
                            <label class="prop-label">강도 <span class="val" id="val-vignette">50%</span></label>
                            <input type="range" id="vignetteStrength" min="0" max="100" value="50">
                        </div>
                    </div>

                    <div class="prop-group">
                        <div class="toggle-row"><span style="font-size:0.85em">그라데이션 오버레이</span><input type="checkbox" id="gradientToggle"></div>
                        <div class="toggle-row"><span style="font-size:0.85em">스캔라인 효과</span><input type="checkbox" id="scanlineToggle"></div>
                        <div class="toggle-row"><span style="font-size:0.85em">비트 글로우(Glow)</span><input type="checkbox" id="glowToggle"></div>
                    </div>

                    <div class="prop-group">
                        <label class="prop-label">파티클 종류</label>
                        <select id="particleSelect">
                            <option value="none">사용 안 함</option>
                            <option value="snow">❄️ 눈 (Snow)</option>
                            <option value="sakura">🌸 벚꽃 (Sakura)</option>
                            <option value="rain">💧 빗방울 (Rain)</option>
                            <option value="sparkle">✨ 반짝임 (Sparkle)</option>
                            <option value="fire">🔥 불꽃 (Fire)</option>
                            <option value="heart">💖 하트 (Heart)</option>
                            <option value="star">⭐ 별똥별 (Star)</option>
                            <option value="bubble">🫧 버블 (Bubble)</option>
                        </select>
                    </div>

                    <div id="particleControls" style="display:none">
                        <div class="prop-group">
                            <label class="prop-label">입자 색상</label>
                            <input type="color" id="particleColor" value="#ffffff" style="width:100%">
                        </div>
                        <div class="prop-group">
                            <label class="prop-label">입자 개수 <span class="val" id="val-particleCount">100</span></label>
                            <input type="range" id="particleCount" min="10" max="300" value="100">
                        </div>
                        <div class="prop-group">
                            <label class="prop-label">입자 크기 <span class="val" id="val-particleSize">4</span></label>
                            <input type="range" id="particleSize" min="1" max="20" value="4">
                        </div>
                        <div class="prop-group">
                            <label class="prop-label">이동 속도 <span class="val" id="val-particleSpeed">3</span></label>
                            <input type="range" id="particleSpeed" min="1" max="10" value="3">
                        </div>
                    </div>
                </div>

                <div id="text-logo" class="tab-content">
                    <div class="prop-group">
                        <label class="prop-label">제목 텍스트</label>
                        <textarea id="mainTitle" rows="2">Lofi Music Mix</textarea>
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">폰트 종류</label>
                        <select id="textFontSelect">
                            <option value="'Noto Sans KR', sans-serif">Noto Sans KR</option>
                            <option value="'Arial', sans-serif">Arial</option>
                            <option value="'Georgia', serif">Georgia</option>
                            <option value="'Courier New', monospace">Courier New</option>
                            <option value="'Impact', sans-serif">Impact</option>
                            <option value="'Verdana', sans-serif">Verdana</option>
                            <option value="'Times New Roman', serif">Times New Roman</option>
                            <option value="'Lucida Console', monospace">Lucida Console</option>
                        </select>
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">폰트 크기 <span class="val" id="val-textSize">60px</span></label>
                        <input type="range" id="textSize" min="10" max="200" value="60">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">텍스트 색상</label>
                        <input type="color" id="textColor" value="#ffffff">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">텍스트 투명도 <span class="val" id="val-textOpacity">100%</span></label>
                        <input type="range" id="textOpacity" min="0" max="100" value="100">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">텍스트 위치 (X) <span class="val" id="val-textX">960</span></label>
                        <input type="range" id="textX" min="0" max="1920" value="960">
                    </div>
                    <div class="prop-group">
                        <label class="prop-label">텍스트 위치 (Y) <span class="val" id="val-textY">960</span></label>
                        <input type="range" id="textY" min="0" max="1080" value="960">
                    </div>
                    
                    <div class="prop-group" style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
                        <button class="btn-action" onclick="document.getElementById('logoInput').click()">🏷️ 로고 업로드</button>
                        <input type="file" id="logoInput" hidden accept="image/*">
                        
                        <div style="margin-top:15px;">
                            <label class="prop-label">로고 X 위치 <span class="val" id="val-logoX">960</span></label>
                            <input type="range" id="logoX" min="0" max="1920" value="960">
                        </div>
                        <div style="margin-top:10px;">
                            <label class="prop-label">로고 Y 위치 <span class="val" id="val-logoY">130</span></label>
                            <input type="range" id="logoY" min="0" max="1080" value="130">
                        </div>
                        
                        <label class="prop-label" style="margin-top:15px">로고 크기 <span class="val" id="val-logoScale">1.0</span></label>
                        <input type="range" id="logoScale" min="0.1" max="2.0" step="0.1" value="1.0">
                        <label class="prop-label">로고 투명도 <span class="val" id="val-logoOpacity">100%</span></label>
                        <input type="range" id="logoOpacity" min="0" max="100" value="100">
                    </div>
                </div>

                <div id="playlist" class="tab-content">
                    <button class="btn-action btn-primary" onclick="document.getElementById('audioInput').click()">🎵 음악 추가 (MP3/WAV)</button>
                    <input type="file" id="audioInput" hidden accept="audio/*" multiple>
                    
                    <div id="playlistContainer" style="margin-top:15px; background:#111; border-radius:8px; max-height: 250px; overflow-y:auto; padding:10px;">
                        <p style="color:#555; text-align:center; font-size:0.8em;">목록이 비어 있습니다.</p>
                    </div>

                    <!-- 오디오 품질 선택 -->
                    <div class="prop-group" style="margin-top:20px;">
                        <label class="prop-label">오디오 내보내기 품질 (Bitrate)</label>
                        <select id="audioBitrateSelect">
                            <option value="320k" selected>320k (고음질 마스터링)</option>
                            <option value="192k">192k (표준 품질)</option>
                        </select>
                    </div>

                    <div style="margin-top:10px;">
                        <button class="btn-action" id="copyTimelineBtn" style="font-size:0.8em; background:#333;">📋 유튜브 타임라인 복사</button>
                    </div>
                </div>
            </div>

            <div class="preview-container">
                <div class="canvas-frame">
                    <canvas id="mainCanvas" width="1920" height="1080"></canvas>
                </div>

                <div class="player-bar">
                    <button class="play-toggle" id="playBtn">▶</button>
                    <div style="flex:1">
                        <div id="nowPlaying" style="font-size: 0.85em; margin-bottom: 5px; color:#eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">곡을 선택하세요</div>
                        <div style="height:4px; background:#333; border-radius:2px; position:relative;">
                            <div id="progressLine" style="height:100%; background:var(--primary); width:0%; border-radius:2px;"></div>
                        </div>
                    </div>
                    <div id="timeText" style="font-size: 0.75em; color:var(--text-dim); font-family: monospace;">00:00 / 00:00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- [내보내기 설정 모달] -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h2>🎬 MP4 내보내기 설정</h2>
            <div class="prop-group">
                <label class="prop-label">파일명</label>
                <input type="text" id="exportFileName" value="spectrum_studio_pro" placeholder="파일명 입력">
            </div>
            <div class="prop-group">
                <label class="prop-label">프레임 레이트 (FPS)</label>
                <select id="exportFPSSelect">
                    <option value="60">60 FPS (최고 화질/부드러움)</option>
                    <option value="30" selected>30 FPS (표준 화질)</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:25px;">
                <button class="btn-action btn-primary" id="startRenderBtn" style="flex:2">렌더링 시작</button>
                <button class="btn-action" id="closeExportModal" style="flex:1">닫기</button>
            </div>
        </div>
    </div>

    <!-- [렌더링 진행 모달] -->
    <div class="modal-overlay" id="renderModal">
        <div class="modal">
            <h2 style="font-size:1.2em;"><span id="renderIcon">⏳</span> 고화질 영상 생성 중</h2>
            <p id="renderStatus" style="font-size: 0.85em; color:#aaa; margin:10px 0;">오디오 데이터를 처리하고 있습니다...</p>
            <div class="progress-track"><div class="progress-fill" id="renderProgress"></div></div>
            <div id="renderDetails" style="font-size: 0.75em; color:#666; font-family: monospace; text-align: center;">0 / 0 Frames</div>
            <p style="font-size:0.7em; color:#ff6b6b; margin-top:15px; text-align:center;">렌더링 중에는 브라우저 탭을 활성 상태로 유지해 주세요.</p>
        </div>
    </div>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        class Particle {
            constructor(w, h, config) {
                this.w = w; this.h = h; this.config = config;
                this.reset();
            }
            reset() {
                this.type = this.config.particle;
                this.x = Math.random() * this.w;
                const upTypes = ['fire', 'heart', 'bubble'];
                if (this.type === 'sparkle' || this.type === 'star') {
                    this.y = Math.random() * this.h;
                } else {
                    this.y = (this.type === 'rain') ? -100 - Math.random() * 500 : (upTypes.includes(this.type) ? this.h + 20 : -20);
                }
                this.size = (Math.random() * 0.5 + 0.5) * this.config.particleSize;
                let s = (Math.random() * 2 + 1) * (this.config.particleSpeed / 3);
                this.speedY = (this.type === 'rain') ? s * 4 : (upTypes.includes(this.type) ? -s : s);
                this.speedX = (this.type === 'rain') ? 0 : (Math.random() * 2 - 1) * (this.config.particleSpeed / 5);

                    let response = await cache.match(url);
                    if (!response || !response.ok) {
                        console.log(`Downloading library to cache: ${url}`);
                        response = await fetch(url);
                        if (!response.ok) throw new Error('Network response failed');
                        await cache.put(url, response.clone());
                    } else {
                        console.log(`Loading library from cache: ${url}`);
                    }
                    const blob = await response.blob();
                    // unpkg의 ESM 워커 접근 문제를 해결하기 위해 toBlobURL을 사용하여 Blob으로 감싸서 리턴
                    return await toBlobURL(blob, mimeType);
                } catch (e) {
                    console.warn("Caching failed, loading directly via toBlobURL:", e);
                    return await toBlobURL(url, mimeType);
                }
            },

            /**
             * [수정] 참고 코드의 안정적인 toBlobURL 패턴 적용
             */
            async initFFmpeg(onProgress) {
                if (this.isFFmpegLoaded) return;
                
                // ES 모듈 주소 설정
                const coreVersion = '0.12.6';
                const baseURL = `https://unpkg.com/@ffmpeg/core@${coreVersion}/dist/esm`;
                
                if (onProgress) this.ffmpeg.on('progress', onProgress);
                this.ffmpeg.on('log', ({ message }) => console.log(message));

                // [해결 핵심] 모든 주요 파일을 toBlobURL로 감싸서 Worker Origin 문제를 우회
                await this.ffmpeg.load({
                    coreURL: await this.getCachedLibrary(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await this.getCachedLibrary(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                    // 0.12 버전에서는 workerURL 대신 classWorkerURL이나 내부 dynamic import가 사용되나
                    // origin null 오류 해결을 위해 core와 wasm을 blob으로 만드는 것이 가장 핵심입니다.
                });

                this.isFFmpegLoaded = true;
            },

            async startExport() {
                const fps = parseInt(document.getElementById('exportFPSSelect').value);
                const fileName = document.getElementById('exportFileName').value || 'spectrum_studio_video';
                const bitrate = this.config.audioBitrate || '320k';
                
                const modal = document.getElementById('renderModal');
                const progressFill = document.getElementById('renderProgress');
                const statusText = document.getElementById('renderStatus');
                const detailText = document.getElementById('renderDetails');
                
                modal.style.display = 'flex';
                try {
                    statusText.innerText = "FFmpeg 안정 로딩 중 (Worker 보안 우회 적용)...";
                    
                    // FFmpeg 초기화
                    await this.initFFmpeg(({ progress }) => {
                        if (this.isEncoding) {
                             const percent = Math.round(progress * 100);
                             statusText.innerText = `최종 MP4 변환 중... ${percent}%`;
                             progressFill.style.width = percent + '%';
                        }
                    });

                    const currentTrack = this.state.playlist[this.state.currentIndex];
                    if (!currentTrack) throw new Error("재생목록에 곡이 없습니다.");
                    
                    statusText.innerText = "오디오 분석 및 프레임 캡처 중...";
                    
                    const audioResponse = await fetch(currentTrack.url);
                    const audioBuffer = await audioResponse.arrayBuffer();
                    
                    const totalFrames = Math.floor(currentTrack.duration * fps);
                    const frameCanvas = document.createElement('canvas'); 
                    frameCanvas.width = 1920; frameCanvas.height = 1080; 
                    const fCtx = frameCanvas.getContext('2d');
                    
                    this.isEncoding = false;

                    // 1. 오프라인 프레임 캡처 루프
                    for (let i = 0; i < totalFrames; i++) {
                        this.draw(fCtx); 
                        const frameData = frameCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
                        await this.ffmpeg.writeFile(`f_${String(i).padStart(7,'0')}.jpg`, Uint8Array.from(atob(frameData), c => c.charCodeAt(0)));
                        
                        const percent = (i / totalFrames) * 100;
                        progressFill.style.width = percent + '%';
                        detailText.innerText = `${i} / ${totalFrames} Frames (${Math.round(percent)}%)`;
                        
                        if(i % 30 === 0) await new Promise(r => setTimeout(r, 1));
                    }

                    await this.ffmpeg.writeFile('audio.mp3', await fetchFile(new Blob([audioBuffer])));

                    // 2. 최종 MP4 인코딩
                    this.isEncoding = true;
                    statusText.innerText = "최종 인코딩 작업을 수행하고 있습니다...";
                    
                    await this.ffmpeg.exec([
                        '-framerate', String(fps),
                        '-i', 'f_%07d.jpg',
                        '-i', 'audio.mp3',
                        '-c:v', 'libx264',
                        '-pix_fmt', 'yuv420p',
                        '-preset', 'fast',
                        '-crf', '22',
                        '-b:a', bitrate,
                        '-shortest',
                        'output.mp4'
                    ]);

                    const data = await this.ffmpeg.readFile('output.mp4');
                    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${fileName}_${fps}fps.mp4`;
                    a.click();
                    URL.revokeObjectURL(url);

                    modal.style.display = 'none'; 
                    alert("성공적으로 제작이 완료되었습니다! 라이브러리는 브라우저에 캐싱되었습니다.");
                } catch(e) { 
                    console.error("Export Error:", e); 
                    alert("렌더링 실패: " + e.message); 
                    modal.style.display = 'none'; 
                }
            }
        };

        window.onload = () => studio.init();
    </script>
</body>
